syntax = "proto3";

option go_package = "github.com/ttpreport/ligolo-mp/v2/protobuf";

package ligolo;

import "google/protobuf/timestamp.proto";

// Ligolo is the operator API. Every RPC is authenticated with the caller's
// operator mTLS certificate (identity = client-cert CommonName; the cert
// thumbprint must match the stored operator). Admin-only RPCs additionally
// require the operator to have admin privileges.
//
// Error semantics (gRPC status codes): Unauthenticated when the client cert is
// missing/unknown/revoked; PermissionDenied when a non-admin calls an
// admin-only RPC; InvalidArgument for malformed input; NotFound for a missing
// session; FailedPrecondition when an operation is refused by a server-side
// invariant (e.g. removing the last admin).
service Ligolo {
  // Join subscribes to the server-side activity event stream (server -> client).
  // The stream stays open until the client disconnects.
  rpc Join (Empty) returns (stream Event) {}
  // GetMetadata returns the calling operator's identity and the server config.
  rpc GetMetadata (Empty) returns (GetMetadataResp) {}

  // GetSessions lists all agent sessions and their state.
  rpc GetSessions (Empty) returns (GetSessionsResp) {}
  // RenameSession sets a session's alias. NotFound if the session is unknown.
  rpc RenameSession (RenameSessionReq) returns (Empty) {}
  // KillSession disconnects an agent and removes the session. Destructive.
  rpc KillSession (KillSessionReq) returns (Empty) {}

  // StartRelay brings up a session's TUN and begins routing. NotFound if unknown.
  rpc StartRelay (StartRelayReq) returns (Empty) {}
  // StopRelay tears down a session's TUN routing.
  rpc StopRelay (StopRelayReq) returns (Empty) {}

  // AddRoute adds a CIDR route to a session. Emits an activity event.
  rpc AddRoute (AddRouteReq) returns (Empty) {}
  // EditRoute replaces a route's CIDR/metric/loopback settings.
  rpc EditRoute (EditRouteReq) returns (Empty) {}
  // MoveRoute moves a route between sessions.
  rpc MoveRoute (MoveRouteReq) returns (Empty) {}
  // DelRoute removes a route from a session. Destructive.
  rpc DelRoute (DelRouteReq) returns (Empty) {}

  // AddRedirector creates a redirector (listener) on a session.
  rpc AddRedirector (AddRedirectorReq) returns (Empty) {}
  // DelRedirector removes a redirector from a session. Destructive.
  rpc DelRedirector (DelRedirectorReq) returns (Empty) {}

  // GetCerts lists certificate metadata. Admin-only.
  rpc GetCerts (Empty) returns (GetCertsResp) {}
  // RegenCert regenerates a certificate by name, invalidating the old one.
  // Admin-only. Destructive.
  rpc RegenCert (RegenCertReq) returns (Empty) {}

  // GetOperators lists all operators and their online status. Admin-only.
  rpc GetOperators (Empty) returns (GetOperatorsResp) {}
  // ExportOperator returns an operator's portable config, which contains the
  // operator's private key. Admin-only. Not exposed via the MCP server.
  rpc ExportOperator (ExportOperatorReq) returns (ExportOperatorResp) {}
  // AddOperator creates a new operator; the server generates its certificate.
  // Admin-only.
  rpc AddOperator (AddOperatorReq) returns (AddOperatorResp) {}
  // DelOperator deletes an operator and revokes its certificate. Admin-only.
  // Destructive. FailedPrecondition when it would remove the last (admin) operator.
  rpc DelOperator (DelOperatorReq) returns (Empty) {}
  // PromoteOperator grants admin privileges to an operator. Admin-only.
  rpc PromoteOperator (PromoteOperatorReq) returns (Empty) {}
  // DemoteOperator revokes admin privileges. Admin-only. FailedPrecondition
  // when it would remove the last admin.
  rpc DemoteOperator (DemoteOperatorReq) returns (Empty) {}

  // GenerateAgent compiles an agent binary for a target platform. Admin-only.
  rpc GenerateAgent (GenerateAgentReq) returns (GenerateAgentResp) {}

  // Traceroute reports which session/interface routes to an IP.
  // InvalidArgument if the IP is malformed.
  rpc Traceroute (TracerouteReq) returns (TracerouteResp) {}
}

// [Objects]

message Empty {}

message Error {
  bytes Object = 1;
  string Reason = 2;
}

message Event {
  int32 Type = 1;
  string Data = 2;
}

message Session {
  string ID = 1;
  string Alias = 2;
  string Hostname = 3;
  Tun Tun = 4;
  bool IsConnected = 5;
  bool IsRelaying = 6;
  repeated Interface Interfaces = 7;
  repeated Redirector Redirectors = 8;
  google.protobuf.Timestamp FirstSeen = 9;
  google.protobuf.Timestamp LastSeen = 10;
}

message Tun {
  string Name = 1;
  repeated Route Routes = 2;
}

message Interface {
  string Name = 1;
  repeated string IPs = 2;
}

message Route {
  string ID = 1;
  string Cidr = 2;
	bool IsLoopback = 3;
  int32 Metric = 4;
}

message Redirector {
  string ID = 1;
  string Protocol = 2;
  string From = 3;
  string To = 4;
}

message Cert {
  string Name = 1;
  string ExpiryDate = 2;
  bytes Certificate = 3;
  bytes Key = 4;
}

message Operator {
  string Name = 1;
  bool IsAdmin = 2;
  string Server = 3;
  bool IsOnline = 4;
  Cert Cert = 5;
  bytes CA = 6;
}

message Config {
  string OperatorServer = 1;
  string AgentServer = 2;
}

message Traceroute {
  bool IsInternal = 1;
  string Session = 2;
  string Iface = 3;
  string Via = 4;
  int32 Metric = 5;
}

// [/Objects]

// [Methods]

message AddRedirectorReq {
  string SessionID = 1;
  string Protocol = 2;
  string From = 3;
  string To = 4;
}

message DelRedirectorReq {
  string SessionID = 1;
  string RedirectorID = 2;
}

message GetSessionsResp {
  repeated Session Sessions = 1;
}

message RenameSessionReq {
  string SessionID = 1;
  string Alias = 2;
}

message StartRelayReq {
  string SessionID = 1;
}

message StopRelayReq {
  string SessionID = 1;
}

message KillSessionReq {
  string SessionID = 1;
}

message AddRouteReq {
  string SessionID = 1;
  Route Route = 2;
}

message EditRouteReq {
  string SessionID = 1;
  string RouteID = 2;
  Route Route = 3;
}

message MoveRouteReq {
  string OldSessionID = 1;
  string RouteID = 2;
  string NewSessionID = 3;
}

message DelRouteReq {
  string SessionID = 1;
  string RouteID = 2;
}

message GenerateAgentReq {
  string Servers = 1;
  string GOOS = 2;
  string GOARCH = 3;
  bool Obfuscate = 4;
  string ProxyServer = 5;
  bool IgnoreEnvProxy = 6;
}

message GenerateAgentResp {
  bytes AgentBinary = 1;
}

message TracerouteReq {
  string IP = 1;
}

message TracerouteResp {
  repeated Traceroute Trace = 1; 
}

message GetCertsResp {
  repeated Cert Certs = 1;
}

message RegenCertReq {
  string Name = 1;
}

message GetOperatorsResp {
  repeated Operator Operators = 1;
}

message ExportOperatorReq {
  string Name = 1;
}

message ExportOperatorResp {
  Operator Operator = 1;
  bytes Config = 2;
}

message AddOperatorReq {
  Operator Operator = 1;
}

message AddOperatorResp {
  Operator Operator = 1;
}

message DelOperatorReq {
  string Name = 1;
}

message PromoteOperatorReq {
  string Name = 1;
}

message DemoteOperatorReq {
  string Name = 1;
}

message GetMetadataResp{
  Operator Operator = 1;
  Config Config = 2;
}

// [/Methods]